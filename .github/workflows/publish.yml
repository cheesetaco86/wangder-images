# @wangder.lab 雲端發布執行器（公開 repo 的 Actions 免費，Mac 關機也會跑）。
# 內容與紀錄在 private repo；這裡只放程式執行流程與已核可的成品。日誌只印摘要，詳細紀錄寫回 private repo。
# 緊急停止：Settings → Variables → PUBLISH_ENABLED 改 0（或在 Mac 執行 publish.py stop / 雙擊桌面「wangder緊急停止」）。
name: publish
on:
  schedule:
    - cron: "5,35 0-15 * * *"   # 台灣時間 08:05–23:35，每 30 分鐘
  workflow_dispatch: {}
concurrency: { group: publish, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出 private 內容庫
        uses: actions/checkout@v4
        with: { repository: cheesetaco86/wangder-lab, ssh-key: "${{ secrets.LAB_DEPLOY_KEY }}", path: lab }
      - name: 取出本 repo（公開成品）
        uses: actions/checkout@v4
        with: { path: lab/publish/public }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pillow numpy scipy
      - run: git config --global user.name "wangder-bot" && git config --global user.email "actions@users.noreply.github.com"
      - name: 發布（到時間且已核可）
        working-directory: lab
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          mkdir -p publish/runs
          LOGF=publish/runs/$(date -u +%Y-%m).log
          echo "=== $(date -u +%FT%TZ) enabled=${PUBLISH_ENABLED:-0}" >> $LOGF
          set +e
          python3 scripts/publish.py run >> $LOGF 2>&1; rc=$?
          python3 scripts/publish.py cleanup >> $LOGF 2>&1
          python3 scripts/publish.py summary
          exit $rc
      - name: 紀錄寫回 private repo
        if: always()
        working-directory: lab
        run: |
          git add -A publish CONTENT_HISTORY.json
          if ! git diff --cached --quiet; then
            git commit -q -m "publish: $(date -u +%FT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
