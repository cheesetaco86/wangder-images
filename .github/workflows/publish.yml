# @wangder.lab 雲端發布執行器（公開 repo 的 Actions 免費，Mac 關機也會跑）。
# 內容與紀錄在 private repo；這裡只放程式執行流程與已核可的成品。日誌只印摘要，詳細紀錄寫回 private repo。
# 緊急停止：Settings → Variables → PUBLISH_ENABLED 改 0（或在 Mac 執行 publish.py stop / 雙擊桌面「wangder緊急停止」）。
name: publish
on:
  schedule:
    - cron: "10,30,50 0-15 * * *"   # 台灣時間 08:10–23:50；對準 12:10／12:30／20:30／21:30
  workflow_dispatch: {}
concurrency: { group: lab-writeback, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出 private 內容庫
        uses: actions/checkout@v4
        with: { repository: cheesetaco86/wangder-lab, ssh-key: "${{ secrets.LAB_DEPLOY_KEY }}", path: lab }
      - name: 取出本 repo（公開成品）
        uses: actions/checkout@v4
        with: { path: lab/publish/public }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pillow numpy scipy imageio-ffmpeg
      - run: git config --global user.name "wangder-bot" && git config --global user.email "actions@users.noreply.github.com"
      - name: 發布（到時間且已核可）
        working-directory: lab
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USERNAME: ${{ secrets.THREADS_USERNAME }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_MODE: ${{ secrets.IG_MODE }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
        run: |
          mkdir -p publish/runs
          LOGF=publish/runs/$(date -u +%Y-%m).log
          echo "=== $(date -u +%FT%TZ) enabled=${PUBLISH_ENABLED:-0}" >> $LOGF
          set +e
          # 佇列只由雲端寫入（避免 Mac 與雲端同時改 queue.json）：每次把所有內容排入，已存在的會略過
          python3 scripts/publish.py plan >> $LOGF 2>&1
          python3 scripts/publish.py run >> $LOGF 2>&1; rc=$?
          python3 scripts/publish.py cleanup >> $LOGF 2>&1
          python3 scripts/comments.py fetch >> $LOGF 2>&1
          python3 scripts/comments.py send >> $LOGF 2>&1
          # Read-only discovery at most once per Taipei day; private output only.
          PROBE_DAY=$(TZ=Asia/Taipei date +%F)
          PROBE_FILE=data/comments/external-probe-${PROBE_DAY}.json
          if [ "${PUBLISH_ENABLED:-0}" = 1 ] && [ ! -f publish/STOP ] && [ ! -f "$PROBE_FILE" ] && [ -f scripts/external_discovery_probe.py ]; then
            mkdir -p data/comments
            if python3 scripts/external_discovery_probe.py --self-test >> "$LOGF" 2>&1; then
              if python3 scripts/external_discovery_probe.py > "$PROBE_FILE.tmp" 2>> "$LOGF"; then
                mv "$PROBE_FILE.tmp" "$PROBE_FILE"
              else
                rm -f "$PROBE_FILE.tmp"
              fi
            fi
          fi
          python3 scripts/publish.py summary
          exit $rc
      - name: 紀錄寫回 private repo（衝突時以 log 重建，不遺失紀錄）
        if: always()
        working-directory: lab
        run: |
          bash scripts/writeback.sh "publish: $(date -u +%FT%H:%MZ)" publish/runs data/comments
